[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbs-classical-lab"
version = "0.1.0"
description = "Reproducible small-instance experiments on classical Gaussian boson sampling surrogates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
gbs-lab = "gbslab.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
